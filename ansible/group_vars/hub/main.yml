# URL’ы и внешние адреса
external_url_prometheus: "https://prom.vpn-for-friends.com"
external_url_alerts: "https://alerts.vpn-for-friends.com"

# Grafana admin (в vault)
grafana_admin_user: "admin"

nginx_sites_available_dir: /etc/nginx/sites-available
nginx_sites_enabled_dir:  /etc/nginx/sites-enabled

# Домены
prom_domain:    "prom.vpn-for-friends.com"
grafana_domain: "grafana.vpn-for-friends.com"
alerts_domain:  "alerts.vpn-for-friends.com"

# Порты бэкендов (host network у сервисов уже включён)
prometheus_port: 9090
grafana_port:    3000
alertmanager_port: 9093

hub_wg_ip: "10.77.0.1"
hub_public_endpoint: "wg-hub.vpn-for-friends.com"
hub_wg_pubkey: "{{ lookup('file', '/etc/wireguard/{{ wg_iface }}.pub') | default('', true) }}"

# Basic auth (лучше держать в vault)
nginx_basic_auth_enabled: true
nginx_users:
  - user: "admin"

# (опц.) allow-list. Пустой список = не включаем.
nginx_allow_list: []     # пример: ["203.0.113.4", "198.51.100.0/24"]

# Сертификаты: choose one of [existing, certbot]
nginx_cert_method: "certbot"

# Для existing — указываем пути:
nginx_certs:
  prom:
    fullchain: "/etc/letsencrypt/live/prom-new.vpn-for-friends.com/fullchain.pem"
    privkey:   "/etc/letsencrypt/live/prom-new.vpn-for-friends.com/privkey.pem"
  grafana:
    fullchain: "/etc/letsencrypt/live/grafana-new.vpn-for-friends.com/fullchain.pem"
    privkey:   "/etc/letsencrypt/live/grafana-new.vpn-for-friends.com/privkey.pem"
  alerts:
    fullchain: "/etc/letsencrypt/live/alerts-new.vpn-for-friends.com/fullchain.pem"
    privkey:   "/etc/letsencrypt/live/alerts-new.vpn-for-friends.com/privkey.pem"

# Для certbot:
certbot_email: "admin@vpn-for-friends.com"
certbot_staging: false      # true — для теста

# Поведение заливки дашбордов (rsync удаляет лишние файлы на целевом хосте)
grafana_dashboards_use_rsync: true

# Alertmanager -> Telegram
am_telegram_api_url: "https://api.telegram.org"
am_telegram_parse_mode: ""                # можно "MarkdownV2" или "HTML"
am_telegram_send_resolved: true

am_global_resolve_timeout: "5m"

am_route_group_by: ['alertname','instance']
am_route_group_wait: "30s"
am_route_group_interval: "5m"
am_route_repeat_interval: "5h"

# Telegram API routes via de-fra-1 over wgmon0.
# Needed for Alertmanager Telegram notifications from monitoring hub.
wg_telegram_gateway_ip: 10.77.0.12

wg_telegram_routes:
  - 149.154.160.0/20
  - 91.108.4.0/22
  - 91.108.8.0/22
  - 91.108.12.0/22
  - 91.108.16.0/22
  - 91.108.56.0/22

# Public/business HTTPS probes (hub Blackbox). Subscription shortUuid is vault-only.
public_http_subscription_short_uuid: "{{ vault_public_http_monitoring_subscription_short_uuid }}"

public_http_targets:
  - name: vff-site
    service: vff
    component: site
    module: http_2xx
    probe_instance: vpn-for-friends.com
    url: https://vpn-for-friends.com
  - name: vff-portal
    service: vff
    component: portal
    module: http_2xx
    probe_instance: vff.portalbase.link
    url: https://vff.portalbase.link/account
  - name: vff-account-redirect
    service: vff
    component: portal-redirect
    module: http_redirect_vff_portal
    probe_instance: vpn-for-friends.com/account
    url: https://vpn-for-friends.com/account
  - name: vff-subscription
    service: vff
    component: subscription
    module: http_subscription_html
    probe_instance: sub.vpn-for-friends.com
    url: "https://sub.vpn-for-friends.com/{{ public_http_subscription_short_uuid }}"
  - name: fc-site
    service: friends-connect
    component: site
    module: http_2xx
    probe_instance: friends-connect.club
    url: https://friends-connect.club
  - name: fc-account-redirect
    service: friends-connect
    component: portal-redirect
    module: http_redirect_fc_portal
    probe_instance: friends-connect.club/account
    url: https://friends-connect.club/account
  - name: fc-portal
    service: friends-connect
    component: portal
    module: http_2xx
    probe_instance: fc.portalbase.link
    url: https://fc.portalbase.link/account
  - name: subscription-next
    service: shared
    component: subscription
    module: http_subscription_html
    probe_instance: sub.portalbase.link
    url: "https://sub.portalbase.link/{{ public_http_subscription_short_uuid }}"
