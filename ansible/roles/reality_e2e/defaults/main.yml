reality_e2e_enabled: true

reality_e2e_user: "{{ node_exporter_user | default('node_exporter') }}"
reality_e2e_group: "{{ node_exporter_group | default('node_exporter') }}"
reality_e2e_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"

reality_e2e_bin_sing_box: /usr/local/bin/sing-box   # путь к бинарю sing-box
reality_e2e_install_sing_box: false                 # если хочешь — добавим установку из tgz позже

# Куда положить скрипт
reality_e2e_script_path: /usr/local/bin/reality_e2e_probe.sh

# базовый корень всего мониторинга
monitoring_root: "/opt/vff-monitoring"

reality_e2e_timer_onboot: "30s"
reality_e2e_timer_interval: "5min"           # используется, если calendar не задан
# reality_e2e_timer_calendar: "*:0/5"        # если задать — будет OnCalendar вместо OnActiveSec
reality_e2e_timer_jitter: "60s"
reality_e2e_timer_accuracy: "15s"

# каталог для JSON/ENV профилей e2e (строится от monitoring_root)
reality_e2e_cfg_dir: "{{ monitoring_root }}/ru-probe/reality"

reality_e2e_defaults:
  log_level: "warn"
  http_test_url: "https://cp.cloudflare.com/generate_204"
  http_timeout: 8
  cfg_dir: "{{ reality_e2e_cfg_dir }}"

reality_e2e_install_xray: true
reality_e2e_xray_version: "latest"         # latest или vX.Y.Z
reality_e2e_xray_install_dir: /usr/local/bin
reality_e2e_xray_dat_dir: /usr/local/lib/xray

reality_e2e_profile_defaults:
  reality:
    engine: sing-box
    socks_port: 1081
    flow: "xtls-rprx-vision"
    fingerprint: "chrome"
  xhttp:
    engine: xray
    socks_port: 1082
    tls: true
    xhttp_mode: "auto"
    xhttp_path: "/api/v1/sync/"
    fingerprint: "chrome"

# пустые плейсхолдеры — чтобы роль не падала при отсутствии group_vars
reality_e2e_shared:
  uuid: ""
  public_key: ""
  short_id: ""
  sni: ""
