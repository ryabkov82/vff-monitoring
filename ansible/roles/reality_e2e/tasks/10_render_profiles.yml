---
# === REALITY E2E: рендер профилей sing-box по inventory (без vpn_nodes) =======

- name: Reality E2E | Assert shared dict exists (may be overridden per host)
  ansible.builtin.assert:
    that:
      - reality_e2e_shared is defined
    fail_msg: >-
      reality_e2e_shared must be defined (defaults may be empty; usually in group_vars/hub/vault.yml).
      Per-host override is supported via host_vars/<node>/vault.yml (reality_e2e_shared.*).
  tags: [reality_e2e]

- name: Reality E2E | Compute cfg dir from monitoring_root (if not set)
  ansible.builtin.set_fact:
    reality_e2e_cfg_dir: "{{ reality_e2e_cfg_dir | default(monitoring_root ~ '/ru-probe/reality') }}"
  tags: [reality_e2e]

- name: Reality E2E | Ensure cfg dir exists
  ansible.builtin.file:
    path: "{{ reality_e2e_cfg_dir }}"
    state: directory
    owner: root
    group: "{{ reality_e2e_group }}"
    mode: "0755"
  tags: [reality_e2e]

# ---- Автодетект server из ~/.ssh/config -------------------------------------

- name: Reality E2E | Parse ~/.ssh/config on controller (Host -> HostName)
  ansible.builtin.shell: |
    set -euo pipefail
    awk '
      tolower($1)=="host"     { host=$2; next }
      tolower($1)=="hostname" { if (host!="") {print host" "$2; host=""} }
    ' ~/.ssh/config | awk '{printf "%s=%s\n",$1,$2}'
  args:
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  register: sshcfg
  changed_when: false
  failed_when: false
  tags: [reality_e2e]

- name: Reality E2E | Build ssh_hostmap dict
  ansible.builtin.set_fact:
    reality_e2e_ssh_hostmap: >-
      {{
        dict(
          (sshcfg.stdout_lines | default([]))
          | map('split', '=', 1)
          | map('list')
        )
      }}
  run_once: true
  tags: [reality_e2e]

# ---- Выбор узлов и вычисление effective -------------------------------------

# Берём только узлы из группы [vpn], где reality.e2e_enabled: true
- name: Reality E2E | Init host list
  ansible.builtin.set_fact:
    reality_e2e_hosts: []
  tags: [reality_e2e]

- name: Reality E2E | Collect hosts with e2e enabled (from [vpn])
  ansible.builtin.set_fact:
    reality_e2e_hosts: "{{ reality_e2e_hosts + [item] }}"
  loop: "{{ groups['vpn'] | default([]) }}"
  when:
    - hostvars[item] is defined
    - (hostvars[item].reality.e2e_enabled | default(false)) | bool
  tags: [reality_e2e]

# Готовим записи с вычисленным server_effective + shared_effective
# shared_effective = reality_e2e_shared (group/hub) + hostvars[item].reality_e2e_shared (override per node)
- name: Reality E2E | Init effective nodes list
  ansible.builtin.set_fact:
    reality_e2e_nodes_eff: []
  tags: [reality_e2e]

- name: Reality E2E | Compute effective settings per node
  ansible.builtin.set_fact:
    reality_e2e_nodes_eff: >-
      {{
        reality_e2e_nodes_eff + [
          {
            'host': item,
            'name': (hostvars[item].node_name | default(item)),
            'reality': (
              {
                'profile': (hostvars[item].reality.e2e_profile | default('reality')),

                'server_effective': (
                  hostvars[item].reality.server
                  | default(
                      reality_e2e_ssh_hostmap[(hostvars[item].ssh_alias | default(item))]
                      | default(hostvars[item].ansible_host | default(''))
                    )
                ),

                'shared_effective': (
                  (reality_e2e_shared | default({}))
                  | combine((hostvars[item].reality_e2e_shared | default({})), recursive=True)
                ),

                'sni': (
                  hostvars[item].reality.sni
                  | default(
                      (
                        (reality_e2e_shared | default({}))
                        | combine((hostvars[item].reality_e2e_shared | default({})), recursive=True)
                      ).sni | default('')
                    )
                ),

                'log_level': (
                  hostvars[item].reality.log_level
                  | default(reality_e2e_defaults.log_level | default('warn'))
                ),

                'engine': (
                  hostvars[item].reality.e2e_engine
                  | default(
                      reality_e2e_profile_defaults[(hostvars[item].reality.e2e_profile | default('reality'))].engine
                    )
                ),

                'socks_port': (
                  hostvars[item].reality.socks_port
                  | default(
                      reality_e2e_profile_defaults[(hostvars[item].reality.e2e_profile | default('reality'))].socks_port
                    )
                )
              }
              | combine(
                  (
                    ((hostvars[item].reality.e2e_profile | default('reality')) == 'reality')
                    | ternary(
                        {
                          'flow': (
                            hostvars[item].reality.flow
                            | default(reality_e2e_profile_defaults.reality.flow | default(''))
                          )
                        },
                        {}
                      )
                  ),
                  recursive=True
                )
              | combine(
                  (
                    ((hostvars[item].reality.e2e_profile | default('reality')) == 'xhttp')
                    | ternary(
                        {
                          'xhttp_path': (
                            hostvars[item].reality.xhttp_path
                            | default(reality_e2e_profile_defaults.xhttp.xhttp_path | default('/api/v1/sync/'))
                          ),
                          'xhttp_mode': (
                            hostvars[item].reality.xhttp_mode
                            | default(reality_e2e_profile_defaults.xhttp.xhttp_mode | default('auto'))
                          ),
                          'xhttp_tls': (
                            hostvars[item].reality.xhttp_tls
                            | default(reality_e2e_profile_defaults.xhttp.tls | default(true))
                          )
                        },
                        {}
                      )
                  ),
                  recursive=True
                )
            )
          }
        ]
      }}
  loop: "{{ reality_e2e_hosts }}"
  loop_control:
    label: "{{ item }}"
  tags: [reality_e2e]

- name: Reality E2E | Assert server can be resolved
  ansible.builtin.assert:
    that:
      - item.reality.server_effective | default('') | length > 0
    fail_msg: >-
      Node {{ item.name }}: cannot resolve REALITY server.
      Установи host_vars/{{ item.host }}.reality.server
      ИЛИ добавь Host/HostName в ~/.ssh/config (с алиасом {{ hostvars[item.host].ssh_alias | default(item.host) }})
      ИЛИ задай ansible_host.
  loop: "{{ reality_e2e_nodes_eff }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [reality_e2e]

- name: Reality E2E | Assert shared secrets are provided (effective per node)
  ansible.builtin.assert:
    that:
      - item.reality.shared_effective.uuid | default('') | length > 0
      - item.reality.shared_effective.public_key | default('') | length > 0
      - item.reality.shared_effective.short_id | default('') | length > 0
    fail_msg: >-
      Node {{ item.name }}: reality_e2e_shared.{uuid, public_key, short_id} must be defined.
      Обычно: group_vars/hub/vault.yml.
      Override: host_vars/{{ item.host }}/vault.yml (reality_e2e_shared.*).
  loop: "{{ reality_e2e_nodes_eff }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [reality_e2e]

# ---- Рендер профилей ---------------------------------------------------------

- name: Reality E2E | Render JSON profiles (by profile type)
  ansible.builtin.template:
    src: >-
      {{
        ((item.reality.profile | default('reality')) == 'xhttp')
        | ternary('xhttp_profile.xray.json.j2', 'reality_profile.singbox.json.j2')
      }}
    dest: "{{ reality_e2e_cfg_dir }}/{{ item.name }}.json"
    owner: root
    group: "{{ reality_e2e_group }}"
    mode: "0644"
  loop: "{{ reality_e2e_nodes_eff }}"
  loop_control:
    label: "{{ item.name }} ({{ item.reality.profile | default('reality') }})"
  vars:
    eff_server: "{{ item.reality.server_effective }}"
    eff_sni: "{{ item.reality.sni }}"
    eff_socks_port: "{{ item.reality.socks_port }}"
    eff_flow: "{{ item.reality.flow | default('') }}"
    eff_log_level: "{{ item.reality.log_level | default(reality_e2e_defaults.log_level | default('warn')) }}"
    eff_http_url: "{{ reality_e2e_defaults.http_test_url | default('https://cp.cloudflare.com/generate_204') }}"
    eff_http_timeout: "{{ reality_e2e_defaults.http_timeout | default(8) }}"
    eff_xhttp_path: "{{ item.reality.xhttp_path | default(reality_e2e_profile_defaults.xhttp.xhttp_path | default('/api/v1/sync/')) }}"
    eff_xhttp_mode: "{{ item.reality.xhttp_mode | default(reality_e2e_profile_defaults.xhttp.xhttp_mode | default('auto')) }}"
    eff_xhttp_tls: "{{ item.reality.xhttp_tls | default(reality_e2e_profile_defaults.xhttp.tls | default(true)) }}"
    eff_shared: "{{ item.reality.shared_effective }}"
  tags: [reality_e2e]

- name: Reality E2E | Render per-node ENV file
  ansible.builtin.template:
    src: "reality_profile.env.j2"
    dest: "{{ reality_e2e_cfg_dir }}/{{ item.name }}.env"
    owner: root
    group: "{{ reality_e2e_group }}"
    mode: "0644"
  loop: "{{ reality_e2e_nodes_eff }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    eff_name: "{{ item.name }}"
    eff_engine: "{{ item.reality.engine | default('sing-box') }}"
    eff_socks_port: "{{ item.reality.socks_port }}"
    eff_http_url: "{{ reality_e2e_defaults.http_test_url | default('https://cp.cloudflare.com/generate_204') }}"
    eff_http_timeout: "{{ reality_e2e_defaults.http_timeout | default(8) }}"
  tags: [reality_e2e]
