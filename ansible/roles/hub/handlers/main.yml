---
# Explicit compose restart scopes. Do not pass services from notifying tasks.

- name: Restart monitoring stack
  listen: Restart monitoring stack
  when: not ansible_check_mode
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_root }}"
    state: restarted

- name: Restart blackbox
  listen: Restart blackbox
  when: not ansible_check_mode
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_root }}"
    state: restarted
    services:
      - blackbox

# ===== Prometheus =====
- name: Prometheus HTTP reload
  listen: Prometheus reload
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/reload"
    method: POST
    status_code: 200
    return_content: false
  register: prom_reload
  failed_when: false
  retries: 3
  delay: 2
  until: prom_reload.status == 200

- name: Fallback restart Prometheus
  listen: Prometheus reload
  when:
    - not ansible_check_mode
    - prom_reload.status is not defined or prom_reload.status != 200
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_root }}"
    state: restarted
    services:
      - prometheus

# ===== Alertmanager =====
- name: Alertmanager HTTP reload
  listen: Alertmanager reload
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ alertmanager_port }}/-/reload"
    method: POST
    status_code: 200
    return_content: false
  register: am_reload
  failed_when: false
  retries: 3
  delay: 2
  until: am_reload.status == 200

- name: Fallback restart Alertmanager
  listen: Alertmanager reload
  when:
    - not ansible_check_mode
    - am_reload.status is not defined or am_reload.status != 200
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_root }}"
    state: restarted
    services:
      - alertmanager

# ===== Grafana =====
- name: Restart grafana
  listen: Restart grafana
  when: not ansible_check_mode
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_root }}"
    files:
      - "{{ monitoring_root }}/docker-compose.yml"
    services:
      - grafana
    state: restarted
